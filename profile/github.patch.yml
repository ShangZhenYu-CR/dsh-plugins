# GitHub 读写工具（Token 在 {{DSH_HOME}}/github-mcp/token）
- insert:
    - id: mcp-github
      name: '@deepseek-ai/dsh-mcp-client'
      config:
        serverName: github
        transport: stdio
        command: !!js process.execPath
        args:
          - {{DSH_HOME}}/github-mcp/server.mjs
        toolCallTimeoutMs: 120000
        failOnStartupError: false
